name: whisper-binaries
on:
  push:
    branches: [whisper-build]
  workflow_dispatch:
jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - run: mkdir w && cd w && git init -q && git remote add origin https://github.com/ggml-org/whisper.cpp && git fetch -q --depth 1 origin 0c7be696371069e0baa2515ed7aa08d5a5473aa6 && git checkout -q FETCH_HEAD && cd .. && cd w && git log -1 --format='%H %cd' > ../commit.txt
      - run: cd w && cmake -B build -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DWHISPER_BUILD_TESTS=OFF && cmake --build build --config Release -j 4 --target whisper-cli
      - run: cd w && bash ./models/download-ggml-model.sh tiny && ls -la models build/bin
      - run: |
          cd w
          ./build/bin/whisper-cli -m models/ggml-tiny.bin -f samples/jfk.wav -l auto -ml 1 -sow -oj -of ../words -np || true
          ./build/bin/whisper-cli -m models/ggml-tiny.bin -f samples/jfk.wav -l auto -ojf -of ../full -np || true
          ./build/bin/whisper-cli -m models/ggml-tiny.bin -f samples/jfk.wav -l auto -ojf -dtw tiny -nfa -of ../dtw -np > ../dtw_log.txt 2>&1 || echo "dtw failed" >> ../dtw_log.txt
          ./build/bin/whisper-cli --help > ../help.txt 2>&1 || true
          cp samples/jfk.wav ../jfk.wav
      - uses: actions/upload-artifact@v4
        with: { name: linux-test, path: "commit.txt\nwords.json\nfull.json\nhelp.txt\ndtw.json\ndtw_log.txt" }
  mac:
    runs-on: macos-14
    steps:
      - run: mkdir w && cd w && git init -q && git remote add origin https://github.com/ggml-org/whisper.cpp && git fetch -q --depth 1 origin 0c7be696371069e0baa2515ed7aa08d5a5473aa6 && git checkout -q FETCH_HEAD && cd ..
      - run: |
          cd w
          cmake -B build -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DWHISPER_BUILD_TESTS=OFF \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DGGML_BLAS=OFF -DGGML_OPENMP=OFF
          cmake --build build --config Release -j 4 --target whisper-cli
          mkdir -p ../out && cp build/bin/whisper-cli ../out/ && lipo -info ../out/whisper-cli && otool -L ../out/whisper-cli
          bash ./models/download-ggml-model.sh tiny && ../out/whisper-cli -m models/ggml-tiny.bin -f samples/jfk.wav -ml 1 -sow -oj -of ../out/test -np && head -c 600 ../out/test.json
      - uses: actions/upload-artifact@v4
        with: { name: whisper-mac, path: "out/whisper-cli" }
  windows:
    runs-on: windows-latest
    steps:
      - run: mkdir w && cd w && git init -q && git remote add origin https://github.com/ggml-org/whisper.cpp && git fetch -q --depth 1 origin 0c7be696371069e0baa2515ed7aa08d5a5473aa6 && git checkout -q FETCH_HEAD && cd ..
      - shell: bash
        run: |
          cd w
          cmake -B build -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DWHISPER_BUILD_TESTS=OFF -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DGGML_OPENMP=OFF
          cmake --build build --config Release -j 4 --target whisper-cli
          mkdir -p ../out && find build -name 'whisper-cli.exe' -exec cp {} ../out/ \; && ls -la ../out
          bash ./models/download-ggml-model.sh tiny && ../out/whisper-cli.exe -m models/ggml-tiny.bin -f samples/jfk.wav -ml 1 -sow -oj -of ../out/test -np && head -c 600 ../out/test.json
      - uses: actions/upload-artifact@v4
        with: { name: whisper-windows, path: "out/whisper-cli.exe" }
  windows-compat:
    runs-on: windows-latest
    steps:
      - shell: bash
        run: mkdir w && cd w && git init -q && git remote add origin https://github.com/ggml-org/whisper.cpp && git fetch -q --depth 1 origin 0c7be696371069e0baa2515ed7aa08d5a5473aa6 && git checkout -q FETCH_HEAD && cd ..
      - shell: bash
        run: |
          cd w
          cmake -B build -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_SSE42=OFF -DGGML_AVX=OFF -DGGML_AVX_VNNI=OFF -DGGML_AVX2=OFF -DGGML_BMI2=OFF -DGGML_AVX512=OFF -DGGML_FMA=OFF -DGGML_F16C=OFF -DWHISPER_BUILD_TESTS=OFF -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DGGML_OPENMP=OFF
          cmake --build build --config Release -j 4 --target whisper-cli
          mkdir -p ../out && find build -name 'whisper-cli.exe' -exec cp {} ../out/whisper-cli-compat.exe \; && ls -la ../out
          bash ./models/download-ggml-model.sh tiny && ../out/whisper-cli-compat.exe -m models/ggml-tiny.bin -f samples/jfk.wav -ml 1 -sow -oj -of ../out/test -np && head -c 600 ../out/test.json
      - uses: actions/upload-artifact@v4
        with: { name: whisper-windows-compat, path: "out/whisper-cli-compat.exe" }
  mac-compat:
    runs-on: macos-14
    steps:
      - run: mkdir w && cd w && git init -q && git remote add origin https://github.com/ggml-org/whisper.cpp && git fetch -q --depth 1 origin 0c7be696371069e0baa2515ed7aa08d5a5473aa6 && git checkout -q FETCH_HEAD && cd ..
      - run: |
          cd w
          cmake -B build -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_SSE42=OFF -DGGML_AVX=OFF -DGGML_AVX_VNNI=OFF -DGGML_AVX2=OFF -DGGML_BMI2=OFF -DGGML_AVX512=OFF -DGGML_FMA=OFF -DGGML_F16C=OFF -DWHISPER_BUILD_TESTS=OFF \
            -DCMAKE_OSX_ARCHITECTURES="x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DGGML_BLAS=OFF -DGGML_OPENMP=OFF
          cmake --build build --config Release -j 4 --target whisper-cli
          mkdir -p ../out && cp build/bin/whisper-cli ../out/whisper-cli-compat && lipo -info ../out/whisper-cli-compat
      - uses: actions/upload-artifact@v4
        with: { name: whisper-mac-compat, path: "out/whisper-cli-compat" }
  publish:
    needs: [test-linux, mac, windows, windows-compat, mac-compat, ffmpeg-linux-test, ffmpeg-windows, ffmpeg-mac]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: art }
      - run: |
          mkdir pub && cd pub && git init -q && git checkout -q -b whisper-bin
          mkdir -p mac win test
          cp ../art/whisper-mac/whisper-cli mac/ && chmod +x mac/whisper-cli
          cp ../art/whisper-windows/whisper-cli.exe win/
          cp ../art/whisper-windows-compat/whisper-cli-compat.exe win/
          cp ../art/whisper-mac-compat/whisper-cli-compat mac/ && chmod +x mac/whisper-cli-compat
          cp ../art/linux-test/* test/
          cp ../art/ffmpeg-windows/ffmpeg.exe win/ && cp ../art/ffmpeg-mac/ffmpeg mac/ && chmod +x mac/ffmpeg
          cp ../art/ffmpeg-test/ff_test.txt test/
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "whisper-cli binaries"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" whisper-bin

  ffmpeg-linux-test:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: git clone --depth 1 -b n7.1 https://github.com/FFmpeg/FFmpeg f
      - run: cd f && ./configure --disable-everything --disable-autodetect --disable-network --disable-doc --disable-debug --disable-x86asm --disable-ffplay --disable-ffprobe --enable-ffmpeg --enable-swscale --disable-avdevice --enable-swresample --enable-avfilter --enable-protocol=file,pipe --enable-demuxer=mov,image2,gif,matroska,avi,mp3,wav,aiff,flac,ogg,mpegts,mpegps,asf,aac,ac3,eac3,w64,caf,mxf,flv,dts,truehd --enable-decoder=tiff,psd,qtrle,rawvideo,dnxhd,bmp,targa,h264,hevc,mpeg4,mpeg2video,vp8,vp9,prores,mjpeg,png,gif,webp,aac,aac_latm,mp3,mp3float,mp2,mp2float,ac3,eac3,dca,truehd,mlp,opus,vorbis,flac,alac,pcm_s16le,pcm_s16be,pcm_s24le,pcm_s24be,pcm_s32le,pcm_s32be,pcm_f32le,pcm_f32be,pcm_f64le,pcm_s8,pcm_u8,pcm_mulaw,pcm_alaw,pcm_bluray,pcm_dvd,adpcm_ima_qt,wmav1,wmav2,wmapro --enable-parser=h264,hevc,mpeg4video,mpegvideo,vp8,vp9,png,gif,aac,aac_latm,ac3,mpegaudio,dca,flac,opus,vorbis,mlp --enable-muxer=wav,image2,rawvideo --enable-encoder=pcm_s16le,mjpeg,rawvideo --enable-filter=abuffer,abuffersink,aformat,anull,aresample,atrim,asetpts,anullsink,buffer,buffersink,format,null,scale,fps,trim,setpts --enable-static --disable-shared && make -j4 ffmpeg && ls -la ffmpeg
      - run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i "sine=f=440:d=20" -f lavfi -i "color=c=black:s=320x240:d=20" -c:a aac -c:v libx264 -shortest t_aac.mp4
          ffmpeg -hide_banner -loglevel error -f lavfi -i "sine=f=440:d=20" -ac 6 -c:a ac3 t_ac3.mkv
          ffmpeg -hide_banner -loglevel error -f lavfi -i "sine=f=440:d=20" -c:a pcm_s24le t_pcm.mov
          for t in t_aac.mp4 t_ac3.mkv t_pcm.mov; do ./f/ffmpeg -nostdin -hide_banner -loglevel error -ss 5 -t 4 -i $t -vn -sn -dn -ac 1 -ar 16000 -c:a pcm_s16le -y out_$t.wav && echo "$t OK $(stat -c%s out_$t.wav) bytes" >> ff_test.txt || echo "$t FAILED" >> ff_test.txt; done
          ffmpeg -hide_banner -loglevel error -f lavfi -i "testsrc2=s=1280x720:d=4" -c:v libx264 -pix_fmt yuv420p t_v.mp4
          mkdir fr && ./f/ffmpeg -nostdin -hide_banner -loglevel error -i t_v.mp4 -t 3 -vf "fps=24,scale='min(960,iw)':-2" -q:v 5 fr/f%04d.jpg && echo "frames OK $(ls fr | wc -l)" >> ff_test.txt || echo "frames FAILED" >> ff_test.txt
          mkdir tf && ffmpeg -hide_banner -loglevel error -f lavfi -i "testsrc2=s=640x360:d=1:r=25" -c:v tiff -compression_algo lzw tf/f_%05d.tif
          n=$(./f/ffmpeg -nostdin -hide_banner -loglevel error -i tf/f_%05d.tif -vf "scale=96:54,format=gray" -f rawvideo - | wc -c) && echo "tiff OK $n" >> ff_test.txt || echo "tiff FAILED" >> ff_test.txt
          ls -la f/ffmpeg >> ff_test.txt
          cat ff_test.txt
      - uses: actions/upload-artifact@v4
        with: { name: ffmpeg-test, path: ff_test.txt }
  ffmpeg-windows:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64
      - run: git clone --depth 1 -b n7.1 https://github.com/FFmpeg/FFmpeg f
      - run: |
          cd f && ./configure --disable-everything --disable-autodetect --disable-network --disable-doc --disable-debug --disable-x86asm --disable-ffplay --disable-ffprobe --enable-ffmpeg --enable-swscale --disable-avdevice --enable-swresample --enable-avfilter --enable-protocol=file,pipe --enable-demuxer=mov,image2,gif,matroska,avi,mp3,wav,aiff,flac,ogg,mpegts,mpegps,asf,aac,ac3,eac3,w64,caf,mxf,flv,dts,truehd --enable-decoder=tiff,psd,qtrle,rawvideo,dnxhd,bmp,targa,h264,hevc,mpeg4,mpeg2video,vp8,vp9,prores,mjpeg,png,gif,webp,aac,aac_latm,mp3,mp3float,mp2,mp2float,ac3,eac3,dca,truehd,mlp,opus,vorbis,flac,alac,pcm_s16le,pcm_s16be,pcm_s24le,pcm_s24be,pcm_s32le,pcm_s32be,pcm_f32le,pcm_f32be,pcm_f64le,pcm_s8,pcm_u8,pcm_mulaw,pcm_alaw,pcm_bluray,pcm_dvd,adpcm_ima_qt,wmav1,wmav2,wmapro --enable-parser=h264,hevc,mpeg4video,mpegvideo,vp8,vp9,png,gif,aac,aac_latm,ac3,mpegaudio,dca,flac,opus,vorbis,mlp --enable-muxer=wav,image2,rawvideo --enable-encoder=pcm_s16le,mjpeg,rawvideo --enable-filter=abuffer,abuffersink,aformat,anull,aresample,atrim,asetpts,anullsink,buffer,buffersink,format,null,scale,fps,trim,setpts --enable-static --disable-shared --arch=x86_64 --target-os=mingw32 --cross-prefix=x86_64-w64-mingw32- --extra-ldflags="-static -static-libgcc" --pkg-config-flags=--static --enable-w32threads || { echo "::error::configure: $(tail -c 900 ffbuild/config.log | tr '\n' ' ')"; exit 1; }
          make -j4 ffmpeg.exe 2>err.txt || { echo "::error::make: $(tail -c 900 err.txt | tr '\n' ' ')"; exit 1; }
          x86_64-w64-mingw32-strip ffmpeg.exe && ls -la ffmpeg.exe && x86_64-w64-mingw32-objdump -p ffmpeg.exe | grep "DLL Name"
          mkdir -p ../out && cp ffmpeg.exe ../out/
      - uses: actions/upload-artifact@v4
        with: { name: ffmpeg-windows, path: out/ffmpeg.exe }
  ffmpeg-mac:
    runs-on: macos-14
    steps:
      - run: git clone --depth 1 -b n7.1 https://github.com/FFmpeg/FFmpeg f && cp -R f fx
      - run: |
          cd f && ./configure --disable-everything --disable-autodetect --disable-network --disable-doc --disable-debug --disable-x86asm --disable-ffplay --disable-ffprobe --enable-ffmpeg --enable-swscale --disable-avdevice --enable-swresample --enable-avfilter --enable-protocol=file,pipe --enable-demuxer=mov,image2,gif,matroska,avi,mp3,wav,aiff,flac,ogg,mpegts,mpegps,asf,aac,ac3,eac3,w64,caf,mxf,flv,dts,truehd --enable-decoder=tiff,psd,qtrle,rawvideo,dnxhd,bmp,targa,h264,hevc,mpeg4,mpeg2video,vp8,vp9,prores,mjpeg,png,gif,webp,aac,aac_latm,mp3,mp3float,mp2,mp2float,ac3,eac3,dca,truehd,mlp,opus,vorbis,flac,alac,pcm_s16le,pcm_s16be,pcm_s24le,pcm_s24be,pcm_s32le,pcm_s32be,pcm_f32le,pcm_f32be,pcm_f64le,pcm_s8,pcm_u8,pcm_mulaw,pcm_alaw,pcm_bluray,pcm_dvd,adpcm_ima_qt,wmav1,wmav2,wmapro --enable-parser=h264,hevc,mpeg4video,mpegvideo,vp8,vp9,png,gif,aac,aac_latm,ac3,mpegaudio,dca,flac,opus,vorbis,mlp --enable-muxer=wav,image2,rawvideo --enable-encoder=pcm_s16le,mjpeg,rawvideo --enable-filter=abuffer,abuffersink,aformat,anull,aresample,atrim,asetpts,anullsink,buffer,buffersink,format,null,scale,fps,trim,setpts --enable-static --disable-shared --extra-cflags="-mmacosx-version-min=11.0" --extra-ldflags="-mmacosx-version-min=11.0" && make -j4 ffmpeg
          cd ../fx && ./configure --disable-everything --disable-autodetect --disable-network --disable-doc --disable-debug --disable-x86asm --disable-ffplay --disable-ffprobe --enable-ffmpeg --enable-swscale --disable-avdevice --enable-swresample --enable-avfilter --enable-protocol=file,pipe --enable-demuxer=mov,image2,gif,matroska,avi,mp3,wav,aiff,flac,ogg,mpegts,mpegps,asf,aac,ac3,eac3,w64,caf,mxf,flv,dts,truehd --enable-decoder=tiff,psd,qtrle,rawvideo,dnxhd,bmp,targa,h264,hevc,mpeg4,mpeg2video,vp8,vp9,prores,mjpeg,png,gif,webp,aac,aac_latm,mp3,mp3float,mp2,mp2float,ac3,eac3,dca,truehd,mlp,opus,vorbis,flac,alac,pcm_s16le,pcm_s16be,pcm_s24le,pcm_s24be,pcm_s32le,pcm_s32be,pcm_f32le,pcm_f32be,pcm_f64le,pcm_s8,pcm_u8,pcm_mulaw,pcm_alaw,pcm_bluray,pcm_dvd,adpcm_ima_qt,wmav1,wmav2,wmapro --enable-parser=h264,hevc,mpeg4video,mpegvideo,vp8,vp9,png,gif,aac,aac_latm,ac3,mpegaudio,dca,flac,opus,vorbis,mlp --enable-muxer=wav,image2,rawvideo --enable-encoder=pcm_s16le,mjpeg,rawvideo --enable-filter=abuffer,abuffersink,aformat,anull,aresample,atrim,asetpts,anullsink,buffer,buffersink,format,null,scale,fps,trim,setpts --enable-static --disable-shared --enable-cross-compile --arch=x86_64 --target-os=darwin --cc="clang -arch x86_64" --extra-cflags="-mmacosx-version-min=11.0" --extra-ldflags="-mmacosx-version-min=11.0 -arch x86_64" && make -j4 ffmpeg
          cd .. && mkdir -p out && lipo -create f/ffmpeg fx/ffmpeg -output out/ffmpeg && strip -x out/ffmpeg || true
          codesign --force -s - out/ffmpeg && lipo -info out/ffmpeg && otool -L out/ffmpeg && ls -la out/ffmpeg
      - uses: actions/upload-artifact@v4
        with: { name: ffmpeg-mac, path: out/ffmpeg }
