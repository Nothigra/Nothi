name = "nothiapp"
main = "worker/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# The worker only runs for pages that need real link previews (and for
# robots.txt / sitemap.xml); every other request is served as a static file.
run_worker_first = ["/", "/marketplace", "/product/*", "/creator/*", "/robots.txt", "/sitemap.xml"]

# Public values (same as the site's .env.production): used to read product
# titles and images for link previews.
