    <style>
      /* Three loading dots (launch screen + in-app loaders). Transform/opacity only. */
      .nothi-dots { display: inline-flex; gap: 7px; align-items: center; }
      .nothi-dots i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .25; animation: nothi-dot 1.1s ease-in-out infinite; }
      .nothi-dots i:nth-child(2) { animation-delay: .16s; }
      .nothi-dots i:nth-child(3) { animation-delay: .32s; }
      @keyframes nothi-dot { 0%, 70%, 100% { opacity: .25; transform: translateY(0) scale(1); } 35% { opacity: 1; transform: translateY(-5px) scale(1.15); } }

      /* App launch screen: drawn by the page itself, so it is on screen before any script has loaded */
      #nothi-splash { display: none; }
      html.app-boot #nothi-splash {
        position: fixed; inset: 0; z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #0A0A0A; color: #FFFFFF; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        transition: opacity .38s ease, transform .5s cubic-bezier(.22, 1, .36, 1);
      }
      html.app-boot[data-theme="light"] #nothi-splash { background: #FFFFFF; color: #0A0A0A; }
      html.app-boot body { background: #0A0A0A; }
      html.app-boot[data-theme="light"] body { background: #FFFFFF; }
      #nothi-splash.out { opacity: 0; transform: scale(1.06); pointer-events: none; }

        var preview = /[?&]app-preview=1/.test(location.search) || (get('nothi-app-preview') === '1' && !/[?&]app-preview=0/.test(location.search));
        if (native || preview) { root.classList.add('app-boot'); window.__nothiSplashStart = Date.now(); }
      })();
    </script>
